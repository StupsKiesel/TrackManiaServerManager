[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmsm"
version = "0.1.0"
description = "TrackMania Server Manager — TUI for managing TM2020 / ManiaPlanet dedicated servers and PyPlanet controllers"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "textual>=0.79",
    "httpx>=0.27",
    "psutil>=5.9",
    "tomli-w>=1.0",
]

[project.scripts]
tmsm = "tmsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmsm = [
    "py.typed",
    "assets/catalog.json",
    "assets/pyplanet_apps/**/*",
    "assets/pyplanet_apps/README.md",
]
